# Publishes the game to GitHub Pages. The site is plain static files — no build
# step — so this stages the three things the browser needs and uploads them.
#
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub
# Actions. The configure-pages step below will try to switch that on by itself,
# but it can only do so if Actions is allowed to write to Pages in this repo.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a running one finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Rules and geometry tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r styles src _site/
          # only matters if the source is ever switched back to a branch deploy
          touch _site/.nojekyll
          echo "Publishing $(find _site -type f | wc -l) files, $(du -sh _site | cut -f1)"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
